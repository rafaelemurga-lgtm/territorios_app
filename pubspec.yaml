name: territorios_app
description: App de territorios con mapas explorables y marcas guardadas.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  photo_view: ^0.15.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/mapas/
    - assets/pin.png
    - assets/pin_azul.png
    - assets/pin_morado.png